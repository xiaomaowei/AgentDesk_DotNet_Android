name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Artifacts
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Tag matches VERSION and Signing Secrets Present
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $versionFromFile = (Get-Content -Path VERSION -Raw).Trim()

          if ($versionFromFile -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            Write-Error "VERSION file content '$versionFromFile' is not a valid strict numeric SemVer (X.Y.Z)."
            exit 1
          }

          $refName = $env:GITHUB_REF_NAME
          $refType = $env:GITHUB_REF_TYPE

          if ($refType -ne "tag") {
            Write-Error "Release workflow must be triggered by a tag push (got ref_type: '$refType')."
            exit 1
          }

          $expectedTag = "v$versionFromFile"
          if ($refName -ne $expectedTag) {
            Write-Error "Tag mismatch! Pushed tag '$refName' does not match root VERSION file ('$versionFromFile', expected '$expectedTag')."
            exit 1
          }

          Write-Host "Version validation passed: Tag '$refName' matches root VERSION file ($versionFromFile)." -ForegroundColor Green

          $missingSecrets = @()
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { $missingSecrets += "ANDROID_KEYSTORE_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) { $missingSecrets += "ANDROID_KEYSTORE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) { $missingSecrets += "ANDROID_KEY_ALIAS" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)) { $missingSecrets += "ANDROID_KEY_PASSWORD" }

          if ($missingSecrets.Count -gt 0) {
            Write-Error "Android release signing configuration failed: Required signing secret(s) missing: $($missingSecrets -join ', '). Never publishing an unsigned APK."
            exit 1
          }

          Write-Host "All 4 Android signing secrets are present." -ForegroundColor Green

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET Solution Tests
        shell: pwsh
        env:
          VSTEST_CONNECTION_TIMEOUT: 180
        run: |
          dotnet test windows/AgentDesk.sln -c Release --nologo --verbosity quiet -m:1

      - name: Publish Windows Binaries
        shell: pwsh
        run: |
          .\Publish-AgentDeskWindows.ps1 -SelfContained

      - name: Archive Windows Artifacts
        shell: pwsh
        run: |
          $version = (Get-Content -Path VERSION -Raw).Trim()
          $zipName = "AgentDesk-Windows-v$version-win-x64.zip"
          $zipPath = Join-Path (Get-Location) $zipName

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          $files = Get-ChildItem -Path "windows/artifacts/AgentDesk.Desktop-win-x64", "windows/artifacts/AgentDesk.Hook-win-x64" -Recurse -File
          foreach ($file in $files) {
              $relPath = [System.IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName).Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $file.FullName, $relPath)
          }
          $zip.Dispose()
          Write-Host "Successfully created $zipName" -ForegroundColor Green

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate Web UI
        shell: pwsh
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run lint
          npm --prefix web-ui run typecheck
          npm --prefix web-ui test -- --run

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Verify Signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $version = (Get-Content -Path VERSION -Raw).Trim()

          $keystoreDir = Join-Path $env:RUNNER_TEMP "keystore"
          New-Item -ItemType Directory -Path $keystoreDir -Force | Out-Null
          $keystorePath = Join-Path $keystoreDir "release.keystore"
          [System.IO.File]::WriteAllBytes($keystorePath, [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim()))

          $env:ORG_GRADLE_PROJECT_ANDROID_KEYSTORE_PATH = $keystorePath
          $env:ORG_GRADLE_PROJECT_ANDROID_KEYSTORE_PASSWORD = $env:ANDROID_KEYSTORE_PASSWORD
          $env:ORG_GRADLE_PROJECT_ANDROID_KEY_ALIAS = $env:ANDROID_KEY_ALIAS
          $env:ORG_GRADLE_PROJECT_ANDROID_KEY_PASSWORD = $env:ANDROID_KEY_PASSWORD
          $env:ORG_GRADLE_PROJECT_VERSION_NAME = $version

          Set-Location android-app
          .\gradlew testDebugUnitTest lintRelease assembleRelease
          Set-Location ..

          $apkOutput = Get-ChildItem -Path "android-app/app/build/outputs/apk/release/*.apk" | Where-Object { $_.Name -notlike "*unsigned*" } | Select-Object -First 1
          if (-not $apkOutput) {
            Write-Error "Android release APK build failed or signed output APK not found."
            exit 1
          }

          $apksignerExe = Get-Command apksigner -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path -First 1
          if (-not $apksignerExe) {
            $sdkDir = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
            if ($sdkDir -and (Test-Path "$sdkDir/build-tools")) {
              $apksignerCandidate = Get-ChildItem -Path "$sdkDir/build-tools" -Filter "apksigner.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($apksignerCandidate) {
                $apksignerExe = $apksignerCandidate.FullName
              }
            }
          }

          if (-not $apksignerExe) {
            Write-Error "apksigner tool could not be located in PATH or Android SDK build-tools."
            exit 1
          }

          Write-Host "Verifying release APK signature with apksigner ($apksignerExe)..." -ForegroundColor Cyan
          & $apksignerExe verify --verbose $apkOutput.FullName
          if ($LASTEXITCODE -ne 0) {
            Write-Error "apksigner signature verification failed for '$($apkOutput.FullName)'."
            exit 1
          }
          Write-Host "apksigner signature verification succeeded." -ForegroundColor Green

          $apkTarget = "AgentDesk-Android-v$version.apk"
          Copy-Item -Path $apkOutput.FullName -Destination $apkTarget
          Write-Host "Successfully created $apkTarget" -ForegroundColor Green

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $version = (Get-Content -Path VERSION -Raw).Trim()
          $winZip = "AgentDesk-Windows-v$version-win-x64.zip"
          $androidApk = "AgentDesk-Android-v$version.apk"

          Get-FileHash -Path $winZip, $androidApk -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content -Path "SHA256SUMS.txt"

          Write-Host "Generated SHA256SUMS.txt:" -ForegroundColor Cyan
          Get-Content SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            AgentDesk-Windows-*.zip
            AgentDesk-Android-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Path VERSION -Raw).Trim()
          $tag = $env:GITHUB_REF_NAME
          $winZip = "AgentDesk-Windows-v$version-win-x64.zip"
          $androidApk = "AgentDesk-Android-v$version.apk"

          gh release create $tag $winZip $androidApk SHA256SUMS.txt --title "AgentDesk $tag" --generate-notes --verify-tag
